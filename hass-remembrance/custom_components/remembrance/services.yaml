# Every service returns {status, items, candidates?, reason?} when asked for a
# response. status: ok | ambiguous (nothing done, see candidates) | no_match |
# invalid. Without a response, anything but ok is raised as an error.

.target: &target
  id:
    name: ID
    description: Item ID(s).
    selector:
      text:
        multiple: true
  entity_id:
    name: Entity
    description: The item's entity (a timer's sensor).
    selector:
      entity:
        integration: remembrance
        multiple: true
  label:
    name: Label
    description: The item's label, matched fuzzily.
    selector:
      text:
  duration:
    name: Set duration
    description: The duration a timer was set to ("the 5-minute timer").
    selector:
      duration:
  remaining:
    name: Time left
    description: Roughly how much time is left.
    selector:
      duration:
  time:
    name: Time of day
    description: A reminder's or alarm's time of day.
    selector:
      time:
  text:
    name: Timer as said
    description: >-
      A timer as a request names it, e.g. "60 Minuten Timer", "Eine Stunde
      Timer", "Nudeltimer": its set duration and label, read with Duckling,
      replace `duration` and `label`. Needs `duckling_url`.
    selector:
      text:
  language:
    name: Language
    description: Of `text`; default Home Assistant's. Parsers so far - de.
    selector:
      language:
  area:
    name: Area
    description: Breaks ties between otherwise equal matches.
    selector:
      area:
  all:
    name: All
    description: Every matching item instead of exactly one.
    default: false
    selector:
      boolean:

timer_start:
  name: Start timer
  fields:
    duration:
      name: Duration
      required: true
      selector:
        duration:
    label:
      name: Label
      selector:
        text:
    area:
      name: Area
      description: "Where it rings (none: everywhere)."
      selector:
        area:

timer_adjust:
  name: Adjust timer
  description: Add or remove time, or set the time left. Exactly one timer.
  fields:
    <<: *target
    delta:
      name: Change
      description: Seconds to add, negative to remove (or "-00:01:00").
      example: 60
      selector:
        number:
          min: -86400
          max: 86400
          unit_of_measurement: s
    set_remaining:
      name: Set time left
      selector:
        duration:
    delta_text:
      name: Change as said
      description: >-
        The change in words, e.g. "eine halbe Stunde", read with Duckling (in
        `language`); the response's `parsed.delta` says what was understood.
        Needs `duckling_url`.
      selector:
        text:
    shorten:
      name: Shorten
      description: Remove `delta_text` instead of adding it.
      default: false
      selector:
        boolean:

timer_pause:
  name: Pause timer
  fields: *target

timer_resume:
  name: Resume timer
  fields: *target

timer_cancel:
  name: Cancel timer
  fields: *target

reminder_create:
  name: Create reminder
  description: Writes a tagged entry to the calendar; it rings at its reminders.
  fields:
    summary:
      name: Summary
      required: true
      selector:
        text:
    at:
      name: At
      description: When it starts (or `in`).
      selector:
        datetime:
    in:
      name: In
      description: How long from now it starts (or `at`).
      selector:
        duration:
    alerts:
      name: Reminders
      description: Seconds before the start to ring at; default [0], on the dot.
      example: "[0, 600]"
      selector:
        object:
    area:
      name: Area
      description: "Where it rings (stored as a category named after the area; none: everywhere)."
      selector:
        area:
    description:
      name: Description
      description: Free text, stored in the entry and passed on with the item.
      selector:
        text:
          multiline: true

reminder_delete:
  name: Delete reminder
  fields: *target

alarm_create:
  name: Create alarm
  description: Writes a tagged entry to the calendar, repeating on `days` or once.
  fields:
    time:
      name: Time
      required: true
      selector:
        time:
    days:
      name: Days
      description: e.g. werktags, wochenende, daily, montags, or a list of days.
      selector:
        text:
          multiple: true
    date:
      name: Date
      description: For a one-off alarm; default the next time `time` comes.
      selector:
        date:
    label:
      name: Label
      selector:
        text:
    area:
      name: Area
      description: "Where it rings (stored as a category named after the area; none: everywhere)."
      selector:
        area:
    description:
      name: Description
      description: Free text, stored in the entry and passed on with the item.
      selector:
        text:
          multiline: true

alarm_skip:
  name: Skip alarm
  description: Leaves out one occurrence of a repeating alarm; a one-off alarm is deleted.
  fields:
    <<: *target
    date:
      name: Date
      description: Default the next occurrence.
      selector:
        date:

alarm_enable:
  name: Enable alarm
  fields: *target

alarm_disable:
  name: Disable alarm
  description: Sets the entry's status to CANCELLED.
  fields: *target

alarm_delete:
  name: Delete alarm
  fields: *target

dismiss:
  name: Dismiss
  description: Stop ringing. Without a target, everything ringing (in the area, if given).
  fields: *target

snooze:
  name: Snooze
  description: >-
    Ring again later. Without a target, what is ringing, else what rang last
    (in the area, if given). The response's `parsed.at` says when it rings
    again.
  fields:
    <<: *target
    delay:
      name: Delay
      description: Defaults to the configured snooze delay.
      selector:
        duration:
    delay_text:
      name: When, as said
      description: >-
        Instead of `delay`: "10 Minuten", "in 10 Minuten", "morgen um 17 Uhr",
        read with Duckling (in `language`). Needs `duckling_url`.
      selector:
        text:
    kind:
      name: Kind
      description: Only what is (or was) ringing of this kind.
      selector:
        select:
          options:
            - timer
            - reminder
            - alarm

parse:
  name: Parse sentence
  description: >-
    What a sentence about a timer, reminder or alarm says, without doing
    anything (in `parsed`). Needs `duckling_url`.
  fields:
    text: &text
      name: Sentence
      description: The whole sentence, e.g. "Weck mich werktags um halb sieben mit Musik".
      required: true
      selector:
        text:
    kind: &kind
      name: Kind
      description: What it is about; default from the sentence.
      selector:
        select:
          options:
            - timer
            - reminder
            - alarm
    language: &language
      name: Language
      description: Default Home Assistant's. Parsers so far - de.
      selector:
        language:

create_from_text:
  name: Create from sentence
  description: >-
    A timer, reminder or alarm as a sentence says it, through timer_start,
    reminder_create or alarm_create; the response also says what was
    understood (`parsed`). Needs `duckling_url`.
  fields:
    text: *text
    kind: *kind
    language: *language
    area:
      name: Area
      description: "Where it rings (none: everywhere)."
      selector:
        area:
    description:
      name: Description
      description: >-
        A reminder's or alarm's description, passed on uninterpreted (e.g. how
        the ring script should wake you). Not read from the sentence.
      selector:
        text:
          multiline: true

alarm_delete_from_text:
  name: Delete alarms from sentence
  description: >-
    Alarms as a request names them, gone. A repeat said ("werktags um 6")
    deletes that repeating alarm; one occurrence ("morgen um 7", "um 7")
    leaves out just that one (a one-off alarm is deleted); a day alone
    ("morgen") leaves out every alarm that day. Without a time only with
    `all`, else `no time`. The response says what was understood
    (`parsed`). Needs `duckling_url`.
  fields:
    text:
      name: Alarms as said
      description: e.g. "morgen um 7", "werktags um 6:30", "für Samstag".
      required: true
      selector:
        text:
    all:
      name: All
      description: >-
        Needed when no time is said ("alle Wecker für morgen"): every alarm
        that day, or every repeating one on those days.
      default: false
      selector:
        boolean:
    language: *language
    area:
      name: Area
      description: Breaks ties between otherwise equal matches.
      selector:
        area:

reminder_delete_from_text:
  name: Delete a reminder from sentence
  description: >-
    The reminder a request names, deleted: by what it is about ("den
    Zahnarzt", matched fuzzily), when it rings ("morgen um 9", "morgen"), or
    both. Several match: `ambiguous`. Needs `duckling_url`.
  fields:
    text:
      name: Reminder as said
      description: e.g. "den Zahnarzt", "morgen um 9", "den Zahnarzt morgen".
      required: true
      selector:
        text:
    language: *language
    area:
      name: Area
      description: Breaks ties between otherwise equal matches.
      selector:
        area:

query:
  name: Query
  description: List items, soonest first.
  fields:
    <<: *target
    kind:
      name: Kind
      selector:
        select:
          options:
            - timer
            - reminder
            - alarm
    state:
      name: State
      selector:
        select:
          options:
            - running
            - paused
            - ringing
            - scheduled
            - disabled
    from:
      name: From
      description: With `to`, one item per occurrence in the window.
      selector:
        datetime:
    to:
      name: To
      selector:
        datetime:
    when_text:
      name: Window as said
      description: >-
        Instead of `from`/`to`: "heute", "nächsten Samstag", "am 17. April",
        "nächste Woche", read with Duckling (in `language`); the response's
        `parsed` has the window. Needs `duckling_url`.
      selector:
        text:
