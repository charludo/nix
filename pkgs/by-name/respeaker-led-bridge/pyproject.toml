[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "respeaker-led-bridge"
version = "0.2.0"
description = "LED ring and XMOS DSP tuning tools for the ReSpeaker Mic Array v2.0"
requires-python = ">=3.11"
dependencies = [
  "pyusb",
]

[project.scripts]
respeaker-tuning-apply = "respeaker_led_bridge.apply_tuning:main"

[tool.setuptools.packages.find]
where = ["src"]
