[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hass-grocery-categorize"
version = "0.1.0"
description = "Embedding-based shopping-list item → category classifier."
requires-python = ">=3.11"
dependencies = [
  "sentence-transformers>=2.2",
  "numpy",
  "rapidfuzz>=3.0",
]

[project.scripts]
grocery-categorize = "grocery_categorize.cli:main"
grocery-print = "grocery_categorize.print:main"

[tool.setuptools.packages.find]
include = ["grocery_categorize*"]
